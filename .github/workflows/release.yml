name: Release

# A tag names the version, so `git push origin v0.0.1` makes its release with all three builds; a dispatch reads the version from Cargo.toml.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The draft stands before any build uploads to it, and a tag must name the version Cargo.toml holds.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - id: version
        run: |
          version=$(cargo pkgid)
          version=${version##*[#@]}
          case "$version" in [0-9]*) ;; *) echo "release: cargo pkgid names no version" >&2; exit 1 ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release: tag $GITHUB_REF_NAME is not v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Make the draft, unless it stands
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release: v$VERSION stands"
          else
            gh release create "v$VERSION" --draft --title "Ztty $VERSION" --notes "Ztty $VERSION"
          fi

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: scripts/windows-zip.ps1
      - name: Put the zip on the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $zip = Get-ChildItem target/release -Filter "Ztty-$env:VERSION-windows-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "release: no zip for $env:VERSION" }
          gh release upload "v$env:VERSION" $zip.FullName --clobber

  linux:
    needs: prepare
    # linux-packages.sh builds on Ubuntu 22.04's glibc inside Docker, which a hosted runner holds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/linux-packages.sh
      - name: Put the four packages and their checksums on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shasum="target/release/Ztty-$VERSION-linux-x86_64.sha256"
          for file in \
            "target/release/Ztty-$VERSION-linux-x86_64.tar.gz" \
            "target/release/ztty_${VERSION}_amd64.deb" \
            "target/release/Ztty-$VERSION-linux-x86_64.AppImage" \
            "target/release/ztty-$VERSION-1.x86_64.rpm" \
            "$shasum"
          do
            [ -f "$file" ] || { echo "release: no $file" >&2; exit 1; }
            gh release upload "v$VERSION" "$file" --clobber
          done

  macos:
    needs: prepare
    # The owner's login session, whose keychain holds the Developer ID identity.
    runs-on: [self-hosted, macos-signing]
    steps:
      - uses: actions/checkout@v7
      # The runner's PATH lacks the host's rustup.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - name: Build, sign and notarize the disk image
        env:
          SIGN_IDENTITY: "Developer ID Application: Yang Zhang (9PDD8M2SMS)"
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          trap 'rm -f "$NOTARY_KEY"' EXIT
          (umask 077 && printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY")
          scripts/mac-app.sh
      - name: Put the disk image on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cargo pkgid)
          scripts/release-asset.sh "target/release/Ztty-${version##*[#@]}.dmg"
